name: Release

# Pushing a tag like v0.27.0 builds the plugin zip and publishes a GitHub
# Release for it. The release notes are the commit subjects since the
# previous tag. The version in package.json / plugin.json is stamped from the
# tag at build time, so tagging is the only release step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the release notes

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in package.json plugin.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Install Decky CLI (pinned by SHA-256)
        run: |
          mkdir -p /tmp/decky-cli
          curl -sSL -o /tmp/decky-cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          echo "6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0  /tmp/decky-cli/decky" | sha256sum -c -
          chmod +x /tmp/decky-cli/decky
          echo "/tmp/decky-cli" >> "$GITHUB_PATH"

      - name: Build plugin zip
        run: |
          sudo "$(which decky)" plugin build -o /tmp/output -s directory "$GITHUB_WORKSPACE"
          sudo chown -R "$(whoami)" . /tmp/output
          cp "$(ls /tmp/output/*.zip | head -1)" /tmp/romm-emudecky.zip

      - name: Smoke-test zip
        run: |
          ZIP=/tmp/romm-emudecky.zip
          for f in main.py plugin.json package.json dist/index.js py_modules/bootstrap.py bin/rom-launcher \
              py_modules/db/migrations/001_initial.sql bios_registry.json; do
            unzip -l "$ZIP" | grep -qE "/$f\b" || { echo "missing $f"; unzip -l "$ZIP"; exit 1; }
          done
          [[ "$(unzip -Z "$ZIP" | grep -E '/bin/rom-launcher$' | awk '{print $1}')" == *x* ]] \
            || { echo "bin/rom-launcher is not executable"; exit 1; }

      - name: Write release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}$GITHUB_REF_NAME
          {
            echo "## Changes${PREV:+ since $PREV}"
            echo
            git log --no-merges --pretty='- %s (%h)' "$RANGE"
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" /tmp/romm-emudecky.zip \
            --title "EmuDecky RomM Manager $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md
