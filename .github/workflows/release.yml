name: Release

# Pushing a tag like v0.27.0 builds the plugin zip and publishes a GitHub
# Release for it. The release notes are the commit subjects since the
# previous tag. The version in package.json / plugin.json is stamped from the
# tag at build time, so tagging is the only release step.
#
# A manual run (workflow_dispatch) on any branch only builds and smoke-tests
# the zip, as a dry run; it never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the release notes

      # No host-side pnpm install: the Decky CLI installs and builds the frontend
      # inside its own builder container, and aborts if it finds a node_modules
      # created by a different pnpm.

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in package.json plugin.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Install Decky CLI (pinned by SHA-256)
        run: |
          mkdir -p /tmp/decky-cli
          curl -sSL -o /tmp/decky-cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          echo "6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0  /tmp/decky-cli/decky" | sha256sum -c -
          chmod +x /tmp/decky-cli/decky
          echo "/tmp/decky-cli" >> "$GITHUB_PATH"

      - name: Build plugin zip
        run: |
          sudo "$(which decky)" plugin build -o /tmp/output -s directory "$GITHUB_WORKSPACE"
          sudo chown -R "$(whoami)" . /tmp/output
          cp "$(ls /tmp/output/*.zip | head -1)" /tmp/romm-emudecky-ng.zip

      - name: Smoke-test zip
        run: |
          ZIP=/tmp/romm-emudecky-ng.zip
          # The zip's top folder becomes the install folder on the device (and
          # the plugin's settings/data identity). The Decky CLI names it after
          # the checkout dir, so a renamed repo would silently change it.
          TOP=$(unzip -Z1 "$ZIP" | head -1 | cut -d/ -f1)
          [ "$TOP" = "romm-emudecky-ng" ] || { echo "zip top folder is '$TOP', expected 'romm-emudecky-ng'"; exit 1; }
          for f in main.py plugin.json package.json dist/index.js py_modules/bootstrap.py py_modules/backend.py \
              py_modules/rpc/server.py py_modules/rpc/client.py bin/rom-launcher-ng \
              py_modules/db/migrations/001_initial.sql bios_registry.json; do
            unzip -l "$ZIP" | grep -qE "/$f\b" || { echo "missing $f"; unzip -l "$ZIP"; exit 1; }
          done
          [[ "$(unzip -Z "$ZIP" | grep -E '/bin/rom-launcher-ng$' | awk '{print $1}')" == *x* ]] \
            || { echo "bin/rom-launcher-ng is not executable"; exit 1; }

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}$GITHUB_REF_NAME
          {
            echo "## Changes${PREV:+ since $PREV}"
            echo
            git log --no-merges --pretty='- %s (%h)' "$RANGE"
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" /tmp/romm-emudecky-ng.zip \
            --title "EmuDecky RomM Manager $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md
